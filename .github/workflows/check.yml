name: Check

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - run: uv sync

      - run: uvx ruff check .

      - run: uvx ruff format --check .

      - run: uvx pytest test
        env:
          PYTHONPATH: "."
