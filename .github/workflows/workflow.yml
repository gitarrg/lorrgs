name: Deploy to AWS

on:
  push:
    branches:
      - main

concurrency: deploy


jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_CONFIG_FILE: .github/workflows/aws_config
      AWS_ACCESS_KEY_ID : ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY : ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7


      - uses: actions/setup-node@v7  # for the CDK CLI

      - run: uv sync

        # Update Images 
      - run: uv run python scripts/load_images.py
        env:
          PYTHONPATH: "."
          BUCKET_NAME: "assets2.lorrgs.io"

      # deploy assets
      - run: ./lorrgs_assets/deploy.sh

      # AWS
      - run: scripts/deploy deploy --all --require-approval never
        env:
          # AWS
          API_CERTIFICATE_ARN: ${{ secrets.API_CERTIFICATE_ARN }}
          # WCL
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
          WCL_AUTH_TOKEN: ${{ secrets.WCL_AUTH_TOKEN }}
          # Discord
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Redis
          REDIS_URL: ${{ secrets.REDIS_URL }}
          # Super Secret Key
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
