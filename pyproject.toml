[project]
name = "lorrgs"
version = "0.0.0-dev"
description = ""
requires-python = ">=3.13.0"
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.14.5",
    "blinker>=1.9.0",
    "fastapi>=0.162.0",
    "mangum>=0.22.0",
    "pydantic>=2.14.2",
    "pyjwt>=2.15.1",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "boto3>=1.43.123",
    "pillow>=13.0.0",
    "pip>=26.2.2",  # for deployment
    "pytest>=9.2.0",
    "requests>=2.34.2",
    "types-boto3[dynamodb,lambda,s3,scheduler,sqs]>=1.43.123",
    "uvicorn[standard]>=0.54.0",
]
infra = [
    "aws-cdk-lib>=2.275.0",
    "constructs>=10.8.1",
    "python-dotenv>=1.2.4",
]


[tool.isort]
line_length = 120
atomic = true
lines_after_imports = 2
profile = "black"


[tool.mypy]
exclude = ["venv"]
show_error_codes = true
# all strict flags
# strict = true
# warn_unused_configs = true
# disallow_any_generics = true
disallow_subclassing_any = false
disallow_untyped_calls = true
# disallow_untyped_defs = true
# disallow_incomplete_defs = true
check_untyped_defs = true
# disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
# no_implicit_reexport = true
# strict_equality = true
# strict_concatenate = true


[[tool.mypy.overrides]]
module = "arrow"
ignore_missing_imports = true


[[tool.mypy.overrides]]
module = "blinker"
ignore_missing_imports = true
